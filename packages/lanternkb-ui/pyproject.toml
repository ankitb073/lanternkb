[project]
name = "lanternkb-ui"
version = "0.1.1"
description = "Optional settings page for lanternkb: runs only on demand, on loopback, and exits when closed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "ankitb073" }]
dependencies = ["lanternkb==0.1.1"]  # and nothing else: the page uses the standard library only. Released together, so pinned

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanternkb_ui"]

[tool.uv.sources]
lanternkb = { workspace = true }
