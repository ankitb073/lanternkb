[feature]
id = "extractor.epub"
title = "EPUB books"
category = "documents"
kind = "extractor"
api_version = 1
default_enabled = false
default_tier = "open"           # the root's tier decides; this does not restrict further
description = "E-books in EPUB format: the text of each chapter, in reading order. An example plugin."

[capabilities]
reads = ["EPUB files inside approved roots"]
network = false
os_permissions = []

[limits]
cpu_seconds = 30
memory_mb = 512
output_mb = 20

[handles]
suffixes = [".epub"]
