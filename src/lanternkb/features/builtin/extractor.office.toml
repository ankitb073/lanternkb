[feature]
id = "extractor.office"
title = "Word, PowerPoint and Excel"
category = "documents"
kind = "extractor"
api_version = 1
default_enabled = true
default_tier = "open"           # the root's tier decides; this does not restrict further
description = "Word (.docx), PowerPoint (.pptx) and Excel (.xlsx) files: body text, slides with notes, and sheet rows."

[capabilities]
reads = ["Office files inside approved roots"]
network = false
os_permissions = []

[limits]
cpu_seconds = 60
memory_mb = 768
output_mb = 20

[handles]
suffixes = [".docx", ".pptx", ".xlsx"]
