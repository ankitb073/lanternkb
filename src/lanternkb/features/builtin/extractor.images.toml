[feature]
id = "extractor.images"
title = "Images (OCR)"
category = "images"
kind = "extractor"
api_version = 1
default_enabled = false
default_tier = "local-only"
description = "Text in screenshots, scans and photos, read on this machine by macOS Vision (needs no permission) or Tesseract. Nothing leaves the device."

[capabilities]
reads = ["image files inside approved roots"]
network = false
os_permissions = []

[limits]
cpu_seconds = 60
memory_mb = 1536
output_mb = 5

[handles]
suffixes = [".png", ".jpg", ".jpeg", ".heic", ".tif", ".tiff", ".gif", ".bmp", ".webp"]
