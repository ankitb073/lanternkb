[feature]
id = "scanner.secrets"
title = "Secret scanning and redaction"
category = "safety"
kind = "scanner"
api_version = 1
required = true                 # cannot be switched off or purged
default_tier = "open"
description = "Finds keys, tokens and passwords before anything is indexed; redacts them or skips the file."

[capabilities]
reads = ["the text of every file being indexed, in memory only"]
network = false
os_permissions = []
