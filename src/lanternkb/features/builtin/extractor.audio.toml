[feature]
id = "extractor.audio"
title = "Audio (transcription)"
category = "audio"
kind = "extractor"
api_version = 1
default_enabled = false
default_tier = "local-only"
description = "Speech in recordings, transcribed on this machine by MLX Whisper or whisper.cpp with a model you fetched yourself (lanternkb models pull). Slow: minutes of CPU per hour of audio. Nothing leaves the device."

[capabilities]
reads = ["audio files inside approved roots"]
network = false
os_permissions = []

[limits]
cpu_seconds = 900
memory_mb = 4096
output_mb = 10

[handles]
suffixes = [".m4a", ".mp3", ".wav", ".aiff", ".aif", ".caf", ".flac", ".ogg"]
