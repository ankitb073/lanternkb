[feature]
id = "extractor.text"
title = "Text and Markdown"
category = "documents"
kind = "extractor"
api_version = 1
default_enabled = true
default_tier = "open"           # the root's tier decides; this does not restrict further
version = 4                     # 2: web pages, rich text, subtitles; 3: fixes; 4: UTF-16 without BOM
description = "Notes, Markdown, plain text, reStructuredText, AsciiDoc, Org, LaTeX, BibTeX, logs, CSV, saved web pages (their readable text), rich text (.rtf, TextEdit's default) and subtitles (.srt, .vtt)."

[capabilities]
reads = ["text files inside approved roots"]
network = false
os_permissions = []

[limits]
cpu_seconds = 30
memory_mb = 512
output_mb = 20

[handles]
suffixes = [".md", ".markdown", ".mdx", ".qmd", ".rmd", ".txt", ".text", ".rst", ".adoc",
            ".asciidoc", ".org", ".tex", ".bib", ".log", ".csv", ".tsv", ".html", ".htm",
            ".xhtml", ".rtf", ".srt", ".vtt", ".textile", ".wiki"]
names = ["README", "LICENSE"]
